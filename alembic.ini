# Alembic configuration for Personal Tracker.
# Runtime migrations are invoked programmatically from database.py, which
# injects the real URL (honours PT_DB_PATH). This ini exists so developers
# can also run:  alembic revision --autogenerate -m "..."
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///tasks.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
