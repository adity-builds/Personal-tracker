name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: pwsh

      - name: Build windowed exe (no console)
        run: |
          pyinstaller PersonalTracker.spec --noconfirm --clean
          dir dist
          # Verify console=False (windowed)
          python -c "import pathlib; txt=pathlib.Path('PersonalTracker.spec').read_text(); assert 'console=False' in txt, 'spec must be windowed'; print('spec console=False verified')"
        shell: pwsh

      - name: Smoke test - check exe is windowed and version endpoint
        run: |
          # Quick check that dist exe exists and is windowed (no console subsystem)
          if (!(Test-Path "dist/PersonalTracker.exe")) { throw "dist/PersonalTracker.exe not found" }
          $info = Get-Item "dist/PersonalTracker.exe"
          Write-Host "Built exe: $($info.Length) bytes, version info:"
          try { (Get-Item "dist/PersonalTracker.exe").VersionInfo | Format-List } catch {}
        shell: pwsh

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            Write-Host "ISCC not found - installing Inno Setup via chocolatey"
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }

          $version = (Get-Content "VERSION" -Raw).Trim()
          if (!$version) { throw "VERSION file is empty" }
          Write-Host "Compiling installer for v$version"
          & $iscc "installer/personal_tracker.iss" "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          if (!(Test-Path "dist/PersonalTrackerSetup-v$version.exe")) {
            throw "installer exe missing from dist/"
          }
          Get-ChildItem dist | Format-Table Name, Length
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PersonalTracker.exe
            dist/PersonalTrackerSetup-v*.exe
          generate_release_notes: true
          body: |
            Personal Tracker ${{ github.ref_name }} — proper installer + portable exe

            **Downloads**
            - `PersonalTrackerSetup-v…exe` — recommended: Start Menu shortcut, uninstaller, auto-updates location in Program Files
            - `PersonalTracker.exe` — portable single file, no installation

            **Note:** the installed version stores task data in `%APPDATA%\PersonalTracker\tasks.db`,
            while the portable exe keeps `tasks.db` next to itself. See README for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
