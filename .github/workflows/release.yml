name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
        shell: pwsh

      - name: Install Node dependencies
        run: |
          npm ci 2>&1 | Out-String -Stream | Select-Object -Last 50
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci failed (lock out of sync), falling back to npm install to sync lock..."
            npm install
            if ($LASTEXITCODE -ne 0) { throw "npm install also failed" }
          }
        shell: pwsh

      - name: Lint - React
        run: npm run lint
        shell: pwsh

      - name: Test - Node core logic
        run: node tests/test_core_logic.js
        shell: pwsh

      - name: Test - Python API
        run: pytest -q
        shell: pwsh

      - name: Verify version consistency
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $py = (python -c "import version; print(version.__version__)").Trim()
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $fvi = Get-Content file_version_info.txt -Raw
          if ($fvi -notmatch "filevers=\((\d+), (\d+), (\d+)") { throw "file_version_info.txt has no filevers tuple" }
          $fv = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          Write-Host "VERSION=$v version.py=$py package.json=$pkg file_version=$fv"
          if ($v -ne $py -or $v -ne $pkg -or $v -ne $fv) { throw "Version mismatch - bump all version sources before releasing" }
        shell: pwsh

      - name: Build React UI (Vite → dist-react)
        run: |
          npm run build
          dir dist-react
          if (!(Test-Path "dist-react/index.html")) { throw "dist-react/index.html not found - Vite build failed" }
        shell: pwsh

      - name: Build Python backend exe (no console)
        run: |
          pyinstaller PersonalTracker.spec --noconfirm --clean
          dir dist
          python -c "import pathlib; txt=pathlib.Path('PersonalTracker.spec').read_text(); assert 'console=False' in txt, 'spec must be windowed'; print('spec console=False verified')"
        shell: pwsh

      - name: Build Electron app (bundles backend exe)
        run: |
          # electron-builder packages dist-react + dist/PersonalTracker.exe (extraResources).
          # Use the fallback builder: editing the Electron exe needs winCodeSign, whose
          # archive contains symlinks that GitHub's Windows runners may not extract.
          # This only skips exe metadata/icon editing; the installer and backend are unaffected.
          npm run electron:build:fallback 2>&1 | Tee-Object -FilePath electron-build.log | Out-String -Stream | Select-Object -Last 100
          if ($LASTEXITCODE -ne 0) {
            "Electron build failed" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Get-Content electron-build.log -Tail 80 | Out-File $env:GITHUB_STEP_SUMMARY -Append
            throw "Electron build failed"
          }
          dir dist-electron
          if (!(Test-Path "dist-electron/win-unpacked/resources/backend/PersonalTracker.exe")) {
            "Electron bundle missing resources/backend/PersonalTracker.exe" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            throw "Electron bundle is missing resources/backend/PersonalTracker.exe"
          }
        shell: pwsh

      - name: Smoke test - check exe is windowed
        run: |
          if (!(Test-Path "dist/PersonalTracker.exe")) { throw "dist/PersonalTracker.exe missing - PyInstaller build failed" }
          $info = Get-Item "dist/PersonalTracker.exe"
          Write-Host "Built backend exe: $($info.Length) bytes"
          try { (Get-Item "dist/PersonalTracker.exe").VersionInfo | Format-List } catch {}
          Get-ChildItem dist -Recurse | Format-Table Name, Length -AutoSize | Out-String -Stream | Select-Object -First 80
        shell: pwsh

      - name: Build installer (Inno Setup wrapping Python exe)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            Write-Host "ISCC not found - installing Inno Setup via chocolatey"
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          $version = (Get-Content "VERSION" -Raw).Trim()
          if (!$version) { throw "VERSION file is empty" }
          Write-Host "Compiling installer for v$version"
          & $iscc "installer/personal_tracker.iss" "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "dist/PersonalTrackerSetup-v$version.exe")) {
            throw "installer exe missing from dist/"
          }
          Get-ChildItem dist | Format-Table Name, Length
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PersonalTracker.exe
            dist/PersonalTrackerSetup-v*.exe
            dist-electron/*.exe
            dist-electron/*.msi
          generate_release_notes: true
          body: |
            Personal Tracker ${{ github.ref_name }} — data safety, settings, and portability

            **Highlights**
            - Automatic rotating SQLite backups at startup (`PT_BACKUP_KEEP`, default 5; `0` disables)
            - JSON and CSV export, plus JSON import in `merge` or `replace` mode; imports refresh the UI immediately
            - Settings menu for Light/Dark theme, 12h/24h clock, Aurora controls, and Data Safety actions
            - Self-contained Electron build with the PyInstaller backend bundled inside
            - Leaner portable exe (~26 MB) with no recursive `dist/` payload
            - CI lint, version-consistency checks, and Electron bundle verification

            **Downloads**
            - `PersonalTrackerSetup-${{ github.ref_name }}.exe` — recommended: Start Menu shortcut, uninstaller, pywebview window
            - `PersonalTracker.exe` — portable standalone app (API on http://127.0.0.1:8000)
            - Electron installer (if built) — optional bundled-backend desktop shell

            **Data and upgrades**
            - Installed builds use `%APPDATA%\PersonalTracker\tasks.db`
            - Portable builds keep data next to the exe; override with `PT_DB_PATH`
            - Rotating backups are written as `tasks.db.bak.<timestamp>` next to the database
            - Existing databases migrate automatically on first launch

            **Full changelog:** https://github.com/adity-builds/Personal-tracker/blob/main/CHANGELOG.md

            **Note:** Windows SmartScreen may warn on first download while this unsigned build builds reputation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
